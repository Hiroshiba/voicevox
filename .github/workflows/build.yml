name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン情報（A.BB.C / A.BB.C-preview.D）"
        required: true
      prerelease:
        description: "プレリリースかどうか"
        type: boolean
        default: true
      code_signing:
        description: "コード署名する"
        type: boolean
        default: false
      upload_artifact:
        description: "デバッグ用に成果物をartifactにアップロードするか"
        type: boolean
        default: false

env:
  VOICEVOX_ENGINE_VERSION: 0.25.2
  VOICEVOX_RESOURCE_VERSION: 0.25.2
  VOICEVOX_EDITOR_VERSION:
    |- # workflow_dispatchのバージョン名か、999.999.999-developが入る
    ${{ github.event.inputs.version || '999.999.999-develop' }}

defaults:
  run:
    shell: bash

jobs:
  build-and-upload:
    environment: ${{ github.event.inputs.code_signing == 'true' && 'code_signing' || '' }} # コード署名用のenvironment（false時の挙動は2022年7月10日時点で未定義動作）
    permissions:
      contents: write
    env:
      ELECTRON_CACHE: .cache/electron
      ELECTRON_BUILDER_CACHE: .cache/electron-builder
      cache-version: v2
      # GNUコマンド
      sed: ${{ startsWith(matrix.os, 'macos-') && 'gsed' || 'sed' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x64)
          - artifact_name: linux-prepackage
            artifact_path: dist_electron/linux-unpacked
            package_name: voicevox
            compressed_artifact_name: voicevox-linux
            installer_artifact_name: linux-appimage
            linux_artifact_name: "VOICEVOX.${ext}"
            linux_executable_name: voicevox
            linux_appimage_7z_name: VOICEVOX.AppImage
            os: ubuntu-22.04
            env_file: .env.download-vvpp
          # Linux (arm64)
          - artifact_name: linux-arm64-prepackage
            artifact_path: dist_electron/linux-arm64-unpacked
            package_name: voicevox
            compressed_artifact_name: voicevox-linux-arm64
            installer_artifact_name: linux-arm64-appimage
            linux_artifact_name: "VOICEVOX.${version}-arm64.${ext}"
            linux_executable_name: voicevox
            linux_appimage_7z_name: VOICEVOX-ARM64.AppImage
            os: ubuntu-22.04-arm
            env_file: .env.download-vvpp
          # Windows
          - artifact_name: windows-prepackage
            artifact_path: dist_electron/win-unpacked
            package_name: voicevox
            compressed_artifact_name: voicevox-windows
            installer_artifact_name: windows-nsis-web
            nsis_web_artifact_name: "VOICEVOX.Web.Setup.${version}.${ext}"
            os: windows-2022
            env_file: .env.download-vvpp
          # macOS (x64)
          - artifact_name: macos-x64-prepackage
            artifact_path: dist_electron/mac
            package_name: voicevox
            compressed_artifact_name: voicevox-macos-x64
            installer_artifact_name: macos-x64-dmg
            macos_artifact_name: "VOICEVOX.${version}-x64.${ext}"
            os: macos-15-intel
            env_file: .env.download-vvpp
          # macOS (arm64)
          - artifact_name: macos-arm64-prepackage
            artifact_path: dist_electron/mac-arm64
            package_name: voicevox
            compressed_artifact_name: voicevox-macos-arm64
            installer_artifact_name: macos-arm64-dmg
            macos_artifact_name: "VOICEVOX.${version}-arm64.${ext}"
            os: macos-14
            env_file: .env.download-vvpp

          # Linux NVIDIA GPU
          - artifact_name: linux-nvidia-prepackage
            artifact_path: dist_electron/linux-unpacked
            voicevox_engine_asset_name: linux-nvidia
            package_name: voicevox-cuda
            compressed_artifact_name: voicevox-linux-nvidia
            installer_artifact_name: linux-nvidia-appimage
            linux_artifact_name: "VOICEVOX-CUDA.${ext}"
            linux_executable_name: voicevox
            linux_appimage_7z_name: VOICEVOX-CUDA.AppImage
            os: ubuntu-22.04
            env_file: .env.embed-engine.linux
          # Linux CPU (x64)
          - artifact_name: linux-cpu-x64-prepackage
            artifact_path: dist_electron/linux-unpacked
            voicevox_engine_asset_name: linux-cpu-x64
            package_name: voicevox-cpu
            compressed_artifact_name: voicevox-linux-cpu-x64
            installer_artifact_name: linux-cpu-x64-appimage
            linux_artifact_name: "VOICEVOX-CPU.${version}-x64.${ext}"
            linux_executable_name: voicevox
            linux_appimage_7z_name: VOICEVOX-CPU-X64.AppImage
            os: ubuntu-22.04
            env_file: .env.embed-engine.linux
          # Linux CPU (arm64)
          - artifact_name: linux-cpu-arm64-prepackage
            artifact_path: dist_electron/linux-arm64-unpacked
            voicevox_engine_asset_name: linux-cpu-arm64
            package_name: voicevox-cpu
            compressed_artifact_name: voicevox-linux-cpu-arm64
            installer_artifact_name: linux-cpu-arm64-appimage
            linux_artifact_name: "VOICEVOX-CPU.${version}-arm64.${ext}"
            linux_executable_name: voicevox
            linux_appimage_7z_name: VOICEVOX-CPU-ARM64.AppImage
            os: ubuntu-22.04-arm
            env_file: .env.embed-engine.linux
          # Windows CUDA
          - artifact_name: windows-nvidia-prepackage
            artifact_path: dist_electron/win-unpacked
            voicevox_engine_asset_name: windows-nvidia
            package_name: voicevox-cuda
            compressed_artifact_name: voicevox-windows-nvidia
            installer_artifact_name: windows-nvidia-nsis-web
            nsis_web_artifact_name: "VOICEVOX-CUDA.Web.Setup.${version}.${ext}"
            os: windows-2022
            env_file: .env.embed-engine.windows
          # Windows CPU
          - artifact_name: windows-cpu-prepackage
            artifact_path: dist_electron/win-unpacked
            voicevox_engine_asset_name: windows-cpu
            package_name: voicevox-cpu
            compressed_artifact_name: voicevox-windows-cpu
            installer_artifact_name: windows-cpu-nsis-web
            nsis_web_artifact_name: "VOICEVOX-CPU.Web.Setup.${version}.${ext}"
            os: windows-2022
            env_file: .env.embed-engine.windows
          # Windows DirectML
          - artifact_name: windows-directml-prepackage
            artifact_path: dist_electron/win-unpacked
            voicevox_engine_asset_name: windows-directml
            package_name: voicevox-directml
            compressed_artifact_name: voicevox-windows-directml
            installer_artifact_name: windows-directml-nsis-web
            nsis_web_artifact_name: "VOICEVOX-DirectML.Web.Setup.${version}.${ext}"
            os: windows-2022
            env_file: .env.embed-engine.windows
          # macOS CPU (x64)
          - artifact_name: macos-cpu-x64-prepackage
            artifact_path: dist_electron/mac
            voicevox_engine_asset_name: macos-x64
            package_name: voicevox-cpu
            compressed_artifact_name: voicevox-macos-cpu-x64
            installer_artifact_name: macos-cpu-x64-dmg
            macos_artifact_name: "VOICEVOX-CPU.${version}-x64.${ext}"
            os: macos-15-intel
            env_file: .env.embed-engine.macos
          # macOS CPU (arm64)
          - artifact_name: macos-cpu-arm64-prepackage
            artifact_path: dist_electron/mac-arm64
            voicevox_engine_asset_name: macos-arm64
            package_name: voicevox-cpu
            compressed_artifact_name: voicevox-macos-cpu-arm64
            installer_artifact_name: macos-cpu-arm64-dmg
            macos_artifact_name: "VOICEVOX-CPU.${version}-arm64.${ext}"
            os: macos-14
            env_file: .env.embed-engine.macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Purge disk space
        if: startsWith(matrix.os, 'ubuntu-')
        run: sudo rm -rf /usr/local/lib/android

      # NOTE: The default sed of macOS is BSD sed.
      #       There is a difference in specification between BSD sed and GNU sed,
      #       so you need to install GNU sed.
      - name: Install GNU sed on macOS
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew install gnu-sed

      # Rename executable file
      # NOTE: If the CPU/DirectML/GPU builds have the same package name,
      #       the NSIS installers and the 7z files have duplicate names.
      #       For Linux, If they have the same product name,
      #       the AppImages have duplicate names.
      #       Files with the same name cannot be uploaded to a single GitHub Release,
      #       so different package/product names should be used for CPU/DirectML/GPU builds.
      - name: Replace package name & version
        run: |
          $sed -i 's/"name": "voicevox"/"name": "${{ matrix.package_name }}"/' package.json
          # $sed -i 's/productName: "VOICEVOX"/productName: "${{ matrix.product_name }}"/' vue.config.js

          $sed -i 's/"version": "999.999.999"/"version": "${{ env.VOICEVOX_EDITOR_VERSION }}"/' package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Cache Electron
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: ${{ env.cache-version }}-${{ runner.os }}--electron-cache-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ env.cache-version }}-${{ runner.os }}--electron-cache-

      - name: Cache Electron-Builder
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ env.cache-version }}-${{ runner.os }}--electron-builder-cache-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ env.cache-version }}-${{ runner.os }}--electron-builder-cache-

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Checkout Product Version Resource
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: VOICEVOX/voicevox_resource
          ref: ${{ env.VOICEVOX_RESOURCE_VERSION }}
          path: resource

      - name: Download VOICEVOX ENGINE
        if: matrix.voicevox_engine_asset_name != null
        id: download-engine
        uses: ./.github/actions/download-engine
        with:
          version: ${{ env.VOICEVOX_ENGINE_VERSION }}
          dest: ${{ github.workspace }}/voicevox_engine
          target: ${{ matrix.voicevox_engine_asset_name }}

      - name: Create and replace software resources
        run: |
          rm build/README.txt
          rm public/policy.md
          {
            cat resource/editor/README.md
            echo
            cat resource/editor/ACKNOWLEDGMENTS.md
          } \
          > build/README.txt
          cp build/README.txt public/policy.md

          cp resource/editor/PRIVACYPOLICY.md public/privacyPolicy.md

      - name: Generate public/licenses.json
        run: |
          pnpm run license:generate -o public/licenses.json

      - name: Overwrite .env.production for installer
        run: |
          cp ./build/${{ matrix.env_file }} .env.production

      - name: Set GTM ID
        run: |
          # GTM ID
          gtm_id=$(jq -er '.gtm_container_id' resource/editor/metas.json)
          echo "VITE_GTM_CONTAINER_ID=$gtm_id" >> $GITHUB_ENV

      - name: Define Code Signing Envs
        if: startsWith(matrix.os, 'windows-') && github.event.inputs.code_signing == 'true'
        run: |
          bash tools/codesign_setup.bash
          THUMBPRINT="$(head -n 1 $THUMBPRINT_PATH)"
          SIGNTOOL_PATH="$(head -n 1 $SIGNTOOL_PATH_PATH)"
          echo "::add-mask::$THUMBPRINT"

          echo "WIN_CERTIFICATE_SHA1=$THUMBPRINT" >> $GITHUB_ENV
          echo 'WIN_SIGNING_HASH_ALGORITHMS=["sha256"]' >> $GITHUB_ENV
          echo "SIGNTOOL_PATH=$SIGNTOOL_PATH" >> $GITHUB_ENV
        env:
          ESIGNERCKA_USERNAME: ${{ secrets.ESIGNERCKA_USERNAME }}
          ESIGNERCKA_PASSWORD: ${{ secrets.ESIGNERCKA_PASSWORD }}
          ESIGNERCKA_TOTP_SECRET: ${{ secrets.ESIGNERCKA_TOTP_SECRET }}
          THUMBPRINT_PATH: /tmp/esignercka_thumbprint.txt
          SIGNTOOL_PATH_PATH: /tmp/signtool_path.txt

      # Build result will be exported to ${{ matrix.artifact_path }}
      - name: Build Electron
        env:
          NSIS_WEB_ARTIFACT_NAME: ${{ matrix.nsis_web_artifact_name }}
          LINUX_ARTIFACT_NAME: ${{ matrix.linux_artifact_name }}
          LINUX_EXECUTABLE_NAME: ${{ matrix.linux_executable_name }}
          MACOS_ARTIFACT_NAME: ${{ matrix.macos_artifact_name }}

          # https://github.com/electron-userland/electron-builder/issues/3179
          USE_HARD_LINKS: false
        run: pnpm run electron:build --dir

      - name: Reset Code Signing Envs
        if: startsWith(matrix.os, 'windows-') && github.event.inputs.code_signing == 'true'
        run: |
          bash tools/codesign_cleanup.bash
          echo 'WIN_CERTIFICATE_SHA1=' >> $GITHUB_ENV
          echo 'WIN_SIGNING_HASH_ALGORITHMS=' >> $GITHUB_ENV
          echo 'SIGNTOOL_PATH=' >> $GITHUB_ENV
        env:
          THUMBPRINT_PATH: /tmp/esignercka_thumbprint.txt

      - name: Rename NoEngine Prepackage
        run: |
          mv ${{ matrix.artifact_path }} ./prepackage

      - name: Merge VOICEVOX ENGINE into prepackage/
        if: matrix.voicevox_engine_asset_name != null && (startsWith(matrix.artifact_name, 'windows-') || startsWith(matrix.artifact_name, 'linux-'))
        run: |
          mv voicevox_engine/ prepackage/vv-engine/

      - name: Merge VOICEVOX ENGINE into prepackage/VOICEVOX.app/Contents/Resources/
        if: matrix.voicevox_engine_asset_name != null && startsWith(matrix.artifact_name, 'macos-')
        run: |
          mv voicevox_engine/ prepackage/VOICEVOX.app/Contents/Resources/vv-engine/

      - name: Recover file permissions
        if: startsWith(matrix.artifact_name, 'linux-') # Linux
        run: |
          chmod +x "prepackage/${{ matrix.linux_executable_name }}"
          if [ -d "prepackage/vv-engine" ]; then
            chmod +x "prepackage/vv-engine/run"
          fi

      - name: Recover file permissions for macOS build
        if: startsWith(matrix.artifact_name, 'macos-') # macOS
        run: |
          chmod +x "prepackage/VOICEVOX.app/Contents/Frameworks/VOICEVOX Helper (GPU).app/Contents/MacOS/VOICEVOX Helper (GPU)"
          chmod +x "prepackage/VOICEVOX.app/Contents/Frameworks/VOICEVOX Helper (Plugin).app/Contents/MacOS/VOICEVOX Helper (Plugin)"
          chmod +x "prepackage/VOICEVOX.app/Contents/Frameworks/VOICEVOX Helper (Renderer).app/Contents/MacOS/VOICEVOX Helper (Renderer)"
          chmod +x "prepackage/VOICEVOX.app/Contents/Frameworks/VOICEVOX Helper.app/Contents/MacOS/VOICEVOX Helper"

          if [ -d "prepackage/VOICEVOX.app/Contents/Resources/vv-engine" ]; then
            chmod +x "prepackage/VOICEVOX.app/Contents/Resources/vv-engine/run"
          fi

      # NOTE: actions/upload-artifact@v4 does not upload `**.lproj` directories, which are an empty directory.
      #       Make `ja.lproj` directory because it is necessary for Japanese localization on macOS.
      - name: Make .lproj directories in Resources directory of VOICEVOX.app
        if: startsWith(matrix.artifact_name, 'macos-')
        run: mkdir -p prepackage/VOICEVOX.app/Contents/Resources/ja.lproj prepackage/VOICEVOX.app/Contents/Resources/en.lproj

      - name: Ad hoc code signing
        if: endsWith(matrix.installer_artifact_name, '-dmg') # macOS
        run: codesign --force --deep -s - prepackage/VOICEVOX.app

      - name: Create Linux tar.gz (without nvidia)
        if: startsWith(matrix.artifact_name, 'linux-') && !contains(matrix.artifact_name, 'nvidia')
        run: |
          name="${{ matrix.compressed_artifact_name }}-${{ env.VOICEVOX_EDITOR_VERSION }}"
          # Use archiver keeps file permissions
          mv prepackage VOICEVOX
          tar czf ${name}.tar.gz VOICEVOX
          mv VOICEVOX prepackage

      - name: Upload Linux tar.gz (without nvidia) to Artifacts
        if: startsWith(matrix.artifact_name, 'linux-') && !contains(matrix.artifact_name, 'nvidia') && github.event.inputs.upload_artifact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}-targz
          path: |-
            ${{ matrix.compressed_artifact_name }}-${{ env.VOICEVOX_EDITOR_VERSION }}.tar.gz

      - name: Upload Linux tar.gz (without nvidia) to Release Assets
        if: startsWith(matrix.artifact_name, 'linux-') && !contains(matrix.artifact_name, 'nvidia') && github.event.inputs.version != ''
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          prerelease: ${{ github.event.inputs.prerelease }}
          tag_name: ${{ env.VOICEVOX_EDITOR_VERSION }}
          files: |-
            ${{ matrix.compressed_artifact_name }}-${{ env.VOICEVOX_EDITOR_VERSION }}.tar.gz
          target_commitish: ${{ github.sha }}

      - name: Delete Linux tar.gz (without nvidia)
        if: startsWith(matrix.artifact_name, 'linux-') && !contains(matrix.artifact_name, 'nvidia')
        run: |
          rm ${{ matrix.compressed_artifact_name }}-${{ env.VOICEVOX_EDITOR_VERSION }}.tar.gz

      - name: Create Windows & Mac zip (without nvidia)
        if: (startsWith(matrix.artifact_name, 'windows-') || startsWith(matrix.artifact_name, 'macos-')) && !contains(matrix.artifact_name, 'nvidia')
        run: |
          name="${{ matrix.compressed_artifact_name }}-${{ env.VOICEVOX_EDITOR_VERSION }}"
          7z a -tzip $name.zip prepackage/
          7z rn $name.zip prepackage/ VOICEVOX/

      - name: Upload Windows & Mac zip (without nvidia) to Artifacts
        if: (startsWith(matrix.artifact_name, 'windows-') || startsWith(matrix.artifact_name, 'macos-')) && !contains(matrix.artifact_name, 'nvidia') && github.event.inputs.upload_artifact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}-zip
          path: |-
            ${{ matrix.compressed_artifact_name }}-${{ env.VOICEVOX_EDITOR_VERSION }}.zip

      - name: Upload Windows & Mac zip (without nvidia) to Release Assets
        if: (startsWith(matrix.artifact_name, 'windows-') || startsWith(matrix.artifact_name, 'macos-')) && !contains(matrix.artifact_name, 'nvidia') && github.event.inputs.version != ''
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          prerelease: ${{ github.event.inputs.prerelease }}
          tag_name: ${{ env.VOICEVOX_EDITOR_VERSION }}
          files: |-
            ${{ matrix.compressed_artifact_name }}-${{ env.VOICEVOX_EDITOR_VERSION }}.zip
          target_commitish: ${{ github.sha }}

      - name: Delete Windows & Mac zip (without nvidia)
        if: (startsWith(matrix.artifact_name, 'windows-') || startsWith(matrix.artifact_name, 'macos-')) && !contains(matrix.artifact_name, 'nvidia')
        run: |
          rm ${{ matrix.compressed_artifact_name }}-${{ env.VOICEVOX_EDITOR_VERSION }}.zip

      - name: Define Code Signing Envs
        if: startsWith(matrix.os, 'windows-') && github.event.inputs.code_signing == 'true'
        run: |
          bash tools/codesign_setup.bash
          THUMBPRINT="$(head -n 1 $THUMBPRINT_PATH)"
          SIGNTOOL_PATH="$(head -n 1 $SIGNTOOL_PATH_PATH)"
          echo "::add-mask::$THUMBPRINT"

          echo "WIN_CERTIFICATE_SHA1=$THUMBPRINT" >> $GITHUB_ENV
          echo 'WIN_SIGNING_HASH_ALGORITHMS=["sha256"]' >> $GITHUB_ENV
          echo "SIGNTOOL_PATH=$SIGNTOOL_PATH" >> $GITHUB_ENV
        env:
          ESIGNERCKA_USERNAME: ${{ secrets.ESIGNERCKA_USERNAME }}
          ESIGNERCKA_PASSWORD: ${{ secrets.ESIGNERCKA_PASSWORD }}
          ESIGNERCKA_TOTP_SECRET: ${{ secrets.ESIGNERCKA_TOTP_SECRET }}
          THUMBPRINT_PATH: /tmp/esignercka_thumbprint.txt
          SIGNTOOL_PATH_PATH: /tmp/signtool_path.txt

      # NOTE: prepackage can be removed before splitting nsis-web archive
      - name: Build Electron
        if: endsWith(matrix.installer_artifact_name, '-nsis-web') || endsWith(matrix.installer_artifact_name, '-appimage') # windows and linux
        env:
          NSIS_WEB_ARTIFACT_NAME: ${{ matrix.nsis_web_artifact_name }}
          LINUX_ARTIFACT_NAME: ${{ matrix.linux_artifact_name }}
          LINUX_EXECUTABLE_NAME: ${{ matrix.linux_executable_name }}
        run: |
          pnpm run electron:build:pack --prepackaged prepackage/

      - name: Build Electron (for macOS)
        if: endsWith(matrix.installer_artifact_name, '-dmg') # macOS
        env:
          MACOS_ARTIFACT_NAME: ${{ matrix.macos_artifact_name }}
        run: |
          pnpm run electron:build:pack --prepackaged prepackage/VOICEVOX.app

      - name: Reset Code Signing Envs
        if: startsWith(matrix.os, 'windows-') && github.event.inputs.code_signing == 'true'
        run: |
          bash tools/codesign_cleanup.bash
          echo 'WIN_CERTIFICATE_SHA1=' >> $GITHUB_ENV
          echo 'WIN_SIGNING_HASH_ALGORITHMS=' >> $GITHUB_ENV
          echo 'SIGNTOOL_PATH=' >> $GITHUB_ENV
        env:
          THUMBPRINT_PATH: /tmp/esignercka_thumbprint.txt

      - name: Create Linux AppImage split
        if: endsWith(matrix.installer_artifact_name, '-appimage')
        run: |
          cd dist_electron/

          for appImageFile in *.AppImage; do
            echo "Splitting ${appImageFile}"

            # Split to MyArtifact.AppImage.7z.001, MyArtifact.AppImage.7z.002, ...
            # Use compression level 0 since AppImage is already compressed
            # .7z is needed for installer_linux.sh yet
            7z -mx=0 -v1900m a "${{ matrix.linux_appimage_7z_name }}.7z" "${appImageFile}"

            # Output split archive hash list
            sha256sum "${{ matrix.linux_appimage_7z_name }}.7z".* > "${{ matrix.installer_artifact_name }}.7z.txt"
          done

      - name: Create Linux installer
        if: endsWith(matrix.installer_artifact_name, '-appimage')
        run: |
          sed \
            -e 's/^NAME=@@PLACEHOLDER@@ # placeholder for CI$/NAME="${{ matrix.installer_artifact_name }}"/' \
            -e 's/^VERSION=@@PLACEHOLDER@@ # placeholder for CI$/VERSION="${{ env.VOICEVOX_EDITOR_VERSION }}"/' \
            build/linux/installer_linux.template.sh > VOICEVOX.${{ matrix.installer_artifact_name }}.${{ env.VOICEVOX_EDITOR_VERSION }}.sh

          # Check that placeholders were replaced
          ! grep "@@PLACEHOLDER@@" VOICEVOX.${{ matrix.installer_artifact_name }}.${{ env.VOICEVOX_EDITOR_VERSION }}.sh

      - name: Upload Linux AppImage split and installer to Artifacts
        if: endsWith(matrix.installer_artifact_name, '-appimage') && github.event.inputs.upload_artifact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.installer_artifact_name }}-release
          path: |-
            dist_electron/*.7z.*
            VOICEVOX.${{ matrix.installer_artifact_name }}.${{ env.VOICEVOX_EDITOR_VERSION }}.sh

      - name: Upload Linux AppImage split and installer to Release Assets
        if: endsWith(matrix.installer_artifact_name, '-appimage') && github.event.inputs.version != ''
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          prerelease: ${{ github.event.inputs.prerelease }}
          tag_name: ${{ env.VOICEVOX_EDITOR_VERSION }}
          files: |-
            dist_electron/*.7z.*
            VOICEVOX.${{ matrix.installer_artifact_name }}.${{ env.VOICEVOX_EDITOR_VERSION }}.sh
          target_commitish: ${{ github.sha }}

      - name: Upload macOS dmg to Artifacts
        if: endsWith(matrix.installer_artifact_name, '-dmg') && github.event.inputs.upload_artifact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.installer_artifact_name }}-release
          path: |-
            dist_electron/*.dmg

      - name: Upload macOS dmg to Release Assets
        if: endsWith(matrix.installer_artifact_name, '-dmg') && github.event.inputs.version != ''
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          prerelease: ${{ github.event.inputs.prerelease }}
          tag_name: ${{ env.VOICEVOX_EDITOR_VERSION }}
          files: |-
            dist_electron/*.dmg
          target_commitish: ${{ github.sha }}

      - name: Upload Windows NSIS Web to Artifacts
        if: endsWith(matrix.installer_artifact_name, '-nsis-web') && github.event.inputs.upload_artifact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.installer_artifact_name }}-release
          path: |-
            dist_electron/nsis-web/out/*.7z.*
            dist_electron/nsis-web/*.exe

      - name: Upload Windows NSIS Web to Release Assets
        if: endsWith(matrix.installer_artifact_name, '-nsis-web') && github.event.inputs.version != ''
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          prerelease: ${{ github.event.inputs.prerelease }}
          tag_name: ${{ env.VOICEVOX_EDITOR_VERSION }}
          files: |-
            dist_electron/nsis-web/out/*.7z.*
            dist_electron/nsis-web/*.exe
          target_commitish: ${{ github.sha }}

  installer-test:
    needs: build-and-upload
    if: github.event.inputs.version != ''
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installer_file: VOICEVOX.linux-appimage.${{ github.event.inputs.version }}.sh
            executable: VOICEVOX.AppImage
          - os: macos-latest
            installer_file: VOICEVOX.${{ github.event.inputs.version }}-arm64.dmg
            executable: VOICEVOX.app/Contents/MacOS/VOICEVOX
          - os: windows-latest
            installer_file: VOICEVOX.Web.Setup.${{ github.event.inputs.version }}.exe
            executable: VOICEVOX.exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Setup installer paths
        run: |
          {
            echo "INSTALLER_DIR=${{ runner.temp }}/voicevox-installer"
            echo "APP_DIR=${{ runner.temp }}/voicevox"
          } >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/measure-volume.mjs" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import os from "node:os";

          const phase = process.argv[2];
          const runnerTemp = process.env.RUNNER_TEMP;
          assert(["before", "installed", "uninstalled"].includes(phase), "容量計測のphaseが不正です。");
          assert(runnerTemp != undefined && runnerTemp !== "", "RUNNER_TEMPがありません。");

          const baselinePath = `${runnerTemp}/voicevox-volume-baseline.json`;
          const volumes = new Map();
          for (const target of [os.homedir(), runnerTemp]) {
            const device = fs.statSync(target).dev;
            if (volumes.has(device)) continue;
            const { bsize, blocks, bfree } = fs.statfsSync(target);
            volumes.set(device, { device, usedBytes: bsize * (blocks - bfree) });
          }

          if (phase === "before") {
            fs.writeFileSync(baselinePath, JSON.stringify([...volumes.values()]));
          } else {
            const baseline = JSON.parse(fs.readFileSync(baselinePath, "utf8"));
            assert.deepStrictEqual([...volumes.keys()].sort(), baseline.map(({ device }) => device).sort(), "容量計測対象のdeviceが変化しました。");
            for (const volume of volumes.values()) {
              const original = baseline.find(({ device }) => device === volume.device);
              assert(original != undefined, "baselineにdeviceがありません。");
              const difference = volume.usedBytes - original.usedBytes;
              const differenceMiB = difference / 1024 ** 2;
              // NOTE: OSのログ更新も全体容量に含まれるため、アンインストール後の判定には余裕を持たせる。
              const thresholdMiB = phase === "installed" ? 0 : 256;
              // TODO: Linuxのアンインストーラーが追加エンジンを削除するようになったら、Linuxを増加期待から外す。
              const expectIncrease = phase === "installed" || process.platform === "linux";
              const valid = expectIncrease
                ? differenceMiB > thresholdMiB
                : differenceMiB <= thresholdMiB;
              const condition = expectIncrease
                ? `${thresholdMiB}MiBより大きい`
                : `${thresholdMiB}MiB以下`;
              assert(valid, `容量差分が条件を満たしません。phase=${phase} differenceMiB=${differenceMiB} condition=${condition}`);
              volume.differenceMiB = differenceMiB;
            }
          }
          console.log(JSON.stringify({ phase, volumes: [...volumes.values()] }));
          NODE

      - name: Install FUSE and xvfb on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb

      - name: Download installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${INSTALLER_DIR}"
          gh release download "${{ github.event.inputs.version }}" \
            --repo "${{ github.repository }}" \
            --dir "${INSTALLER_DIR}" \
            --pattern "${{ matrix.installer_file }}"

      # NOTE: /S では画面遷移時の分割アーカイブ取得・結合が実行されないため、完全なアーカイブを事前に用意する。
      - name: Prepare Windows application package
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.version }}" \
            --repo "${{ github.repository }}" \
            --dir "${INSTALLER_DIR}" \
            --pattern "voicevox-${{ github.event.inputs.version }}-x64.nsis.7z.[0-9]*"
          archive_path="${INSTALLER_DIR}/voicevox-${{ github.event.inputs.version }}-x64.nsis.7z"
          mapfile -t archive_parts < <(printf '%s\n' "$archive_path".[0-9]* | sort -V)
          cat "${archive_parts[@]}" > "$archive_path"

      - name: Disable Spotlight indexing before capacity measurement
        if: runner.os == 'macOS'
        run: |
          # NOTE: Spotlightの索引更新による容量増加を、アンインストール後の残存と誤判定しないため
          sudo -n mdutil -i off /System/Volumes/Data
          sudo -n mdutil -s /System/Volumes/Data

      - name: Measure filesystem before application install
        run: node "$RUNNER_TEMP/measure-volume.mjs" before

      - name: Install Linux application
        if: runner.os == 'Linux'
        run: |
          REPO_URL="https://github.com/${{ github.repository }}" \
            FORCE_INSTALL=1 \
            bash "${INSTALLER_DIR}/${{ matrix.installer_file }}"

      - name: Install macOS application
        if: runner.os == 'macOS'
        env:
          DMG_MOUNT_POINT: ${{ runner.temp }}/voicevox-dmg
        run: |
          mkdir -p "${DMG_MOUNT_POINT}" "${APP_DIR}"
          hdiutil attach -nobrowse -readonly \
            -mountpoint "${DMG_MOUNT_POINT}" \
            "${INSTALLER_DIR}/${{ matrix.installer_file }}"
          ditto "${DMG_MOUNT_POINT}/VOICEVOX.app" "${APP_DIR}/VOICEVOX.app"
          hdiutil detach "${DMG_MOUNT_POINT}"

      - name: Install Windows application with Git Bash
        if: runner.os == 'Windows'
        run: |
          MSYS2_ARG_CONV_EXCL='/S;/D=' \
            "$(cygpath -u "${INSTALLER_DIR}/${{ matrix.installer_file }}")" \
            /S "/D=$(cygpath -w "$APP_DIR")"

      - name: Run installer test
        env:
          VOICEVOX_EXECUTABLE_PATH: ${{ runner.temp }}/voicevox/${{ matrix.executable }}
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run --auto-servernum pnpm exec playwright test --config playwright.installed.config.ts
          else
            pnpm exec playwright test --config playwright.installed.config.ts
          fi

      - name: Measure filesystem after installer test
        run: node "$RUNNER_TEMP/measure-volume.mjs" installed

      - name: Uninstall Linux application
        if: runner.os == 'Linux'
        run: bash "${APP_DIR}/uninstaller_linux.sh"

      # NOTE: public/howtouse.md の手順に従い、CI ではゴミ箱の代わりに VOICEVOX.app と追加エンジンを完全削除する。
      - name: Uninstall macOS application
        if: runner.os == 'macOS'
        run: |
          rm -r \
            "${APP_DIR}/VOICEVOX.app" \
            "${HOME}/Library/Application Support/voicevox/vvpp-engines"

      # NOTE: _?= で NSIS の一時コピーを止めて終了を待ち、実行中に削除できないアンインストーラー自身を終了後に削除する。
      - name: Uninstall Windows application
        if: runner.os == 'Windows'
        run: |
          MSYS2_ARG_CONV_EXCL='/S;--delete-app-data;_?=' \
            "$(cygpath -u "${APP_DIR}/Uninstall VOICEVOX.exe")" \
            /S --delete-app-data "_?=$(cygpath -w "$APP_DIR")"
          rm "$(cygpath -u "${APP_DIR}/Uninstall VOICEVOX.exe")"
          rmdir "$(cygpath -u "$APP_DIR")"

      - name: Measure filesystem after application uninstall
        run: node "$RUNNER_TEMP/measure-volume.mjs" uninstalled
